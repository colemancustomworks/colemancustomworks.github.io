<!doctype html>
<html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Updates | Coleman Customworks</title><meta name="description" content="Repair. Renovate. Transform. Kitchens, bathrooms, custom builds and more."><link rel="icon" href="images/ccw-logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono&display=swap"></head><body style="margin:0;background:#0e0e10">
<style>
.site-head{background:#0e0e10;color:#f5f5f7;font-family:Geist,-apple-system,system-ui,sans-serif;text-align:center;padding:18px 12px 10px;position:sticky;top:0;z-index:50;border-bottom:1px solid #f5f5f71f}
.site-head .brand{font-size:22px;font-weight:500;color:#f5f5f7;text-decoration:none}
.site-head nav{display:flex;gap:22px;justify-content:center;overflow-x:auto;white-space:nowrap;padding:8px 4px 4px;-webkit-overflow-scrolling:touch}
.site-head nav a{color:#f5f5f7;text-decoration:none;font-size:15px;opacity:.9}
.site-head nav a:hover{opacity:1;text-decoration:underline}
@media(max-width:799px){.site-head nav{justify-content:flex-start}}
.page{background:#0e0e10;color:#f5f5f7;font-family:Geist,-apple-system,system-ui,sans-serif;min-height:70vh;padding:48px 20px}
.wrap{max-width:900px;margin:0 auto}
.page h1{font-size:clamp(34px,6vw,56px);font-weight:500;line-height:1.05;margin:0 0 14px}
.page p.lead{color:#a1a1a6;margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.grid figure{margin:0}.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;display:block}
.grid figcaption,.vid figcaption{color:#a1a1a6;font-size:14px;margin-top:8px}
.vid{margin:36px auto 0;max-width:360px}.vid video{width:100%;border-radius:14px;background:#000}
form.app label{display:block;margin:18px 0 6px;font-size:15px}
form.app .req{color:#a1a1a6;font-size:13px;margin-left:6px}
form.app input[type=text],form.app input[type=email],form.app input[type=tel],form.app select,form.app textarea{width:100%;box-sizing:border-box;background:#0e0e10;color:#f5f5f7;border:1px solid #f5f5f766;border-radius:22px;padding:11px 16px;font:inherit}
form.app textarea{border-radius:14px;min-height:110px}
form.app .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form.app .choices{display:flex;gap:22px}form.app .choices label{display:flex;gap:8px;align-items:center;margin:4px 0}
form.app button{margin-top:28px;background:#f5f5f7;color:#0e0e10;border:0;border-radius:24px;padding:13px 26px;font:inherit;font-weight:600;letter-spacing:.06em;cursor:pointer}
.foot{background:#0e0e10;color:#a1a1a6;font-family:Geist,system-ui,sans-serif;font-size:13px;text-align:center;padding:24px;border-top:1px solid #f5f5f71f}
.posts{display:flex;flex-direction:column;gap:22px;max-width:620px}
.post{border:1px solid #f5f5f71f;border-radius:18px;padding:18px 18px 16px;background:#141417}
.post .meta{color:#a1a1a6;font-size:13px;margin-bottom:8px}.post .tag{display:inline-block;border:1px solid #f5f5f744;border-radius:12px;padding:1px 9px;margin-left:8px;font-size:12px}
.post p{margin:0 0 10px;line-height:1.5;white-space:pre-line}.post img,.post video{width:100%;border-radius:12px;margin-top:8px;display:block;background:#000}
</style>
<header class="site-head"><a class="brand" translate="no" href="index.html">Coleman Customworks LLC</a>
<nav><a href="index.html#services">What We Do</a><a href="index.html#how">How It Works</a><a href="our-work.html">Our Work</a><a href="updates.html">Updates</a><a href="index.html#why">Why Us</a><a href="index.html#testimonials">Testimonials</a><a href="index.html#weather">Weather</a><a href="index.html#contact">Contact</a><a href="join-the-team.html">Join the Team</a></nav></header>
<main class="page"><div class="wrap"><h1>Updates</h1><p class="lead">News, thoughts and job pics from Quin, posted through the week.</p><div class="posts" id="posts"></div></div></main>
<script>
fetch('updates.json?'+Date.now()).then(r=>r.json()).then(list=>{const box=document.getElementById('posts');
if(!list.length){box.innerHTML='<p style="color:#a1a1a6">First update coming soon.</p>';return}
list.sort((a,b)=>(+b.id||0)-(+a.id||0)||b.date.localeCompare(a.date));
for(const p of list){const el=document.createElement('article');el.className='post';
const d=new Date(p.date+'T12:00:00');let h='<div class="meta">'+d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})+(p.tag?'<span class="tag">'+p.tag+'</span>':'')+'</div>';
if(p.text)h+='<p></p>';(p.images||[]).forEach(i=>h+='<img loading="lazy" alt="" src="'+i+'">');(p.videos||[]).forEach(v=>h+='<video controls playsinline preload="metadata" src="'+v+'"></video>');
el.innerHTML=h;if(p.text)el.querySelector('p').textContent=p.text;box.appendChild(el)}}).catch(()=>{});
</script>
</main><footer class="foot">© 2026 Coleman Customworks LLC · Twin City, Georgia</footer>
